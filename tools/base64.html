  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      line-height: 1.6;
      color: #333;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1600px;
      margin: 0 auto;
      background: white;
      border-radius: 15px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      color: white;
      padding: 40px;
      text-align: center;
    }

    .header h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
      font-weight: 600;
    }

    .header p {
      font-size: 1.1rem;
      opacity: 0.9;
    }

    .content {
      padding: 40px;
    }

    .main-area {
      display: flex;
      gap: 20px;
      align-items: stretch;
    }

    .panel {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .input-label {
      font-size: 1.2rem;
      font-weight: 600;
      color: #4f46e5;
      margin-bottom: 10px;
      display: block;
    }

    textarea {
      width: 100%;
      flex: 1;
      min-height: 400px;
      padding: 15px;
      border: 2px solid #e5e7eb;
      border-radius: 10px;
      font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
      font-size: 14px;
      resize: vertical;
      transition: all 0.3s ease;
      background: #f9fafb;
    }

    textarea:focus {
      outline: none;
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
      background: white;
    }

    .button-column {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 12px;
      padding: 0 5px;
    }

    .convert-btn {
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(79, 70, 229, 0.3);
      white-space: nowrap;
    }

    .convert-btn:not(.active) {
      background: #d1d5db;
      box-shadow: none;
      opacity: 0.7;
    }

    .convert-btn:not(.active):hover {
      opacity: 1;
      transform: translateY(-2px);
    }

    .convert-btn.active:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(79, 70, 229, 0.4);
    }

    .convert-btn:active {
      transform: translateY(0);
    }

    .convert-btn.decode.active {
      background: linear-gradient(135deg, #059669 0%, #10b981 100%);
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
    }

    .convert-btn.decode.active:hover {
      box-shadow: 0 8px 25px rgba(16, 185, 129, 0.4);
    }

    .result-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .result-label .input-label {
      color: #059669;
      margin-bottom: 0;
    }

    .output-panel textarea {
      background: white;
      border: 2px solid #d1fae5;
    }

    .copy-btn {
      background: #10b981;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s ease;
      margin-top: 10px;
    }

    .copy-btn:hover {
      background: #059669;
    }

    .copy-btn.copied {
      background: #6b7280;
    }

    .pretty-toggle {
      display: none;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      color: #374151;
    }

    .pretty-toggle.visible {
      display: flex;
    }

    .toggle-switch {
      position: relative;
      width: 44px;
      height: 24px;
      cursor: pointer;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle-slider {
      position: absolute;
      inset: 0;
      background: #d1d5db;
      border-radius: 24px;
      transition: background 0.2s ease;
    }

    .toggle-slider::before {
      content: '';
      position: absolute;
      width: 18px;
      height: 18px;
      left: 3px;
      bottom: 3px;
      background: white;
      border-radius: 50%;
      transition: transform 0.2s ease;
    }

    .toggle-switch input:checked + .toggle-slider {
      background: #4f46e5;
    }

    .toggle-switch input:checked + .toggle-slider::before {
      transform: translateX(20px);
    }

    .error-msg {
      color: #dc2626;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 8px;
      padding: 12px 16px;
      margin-top: 15px;
      display: none;
      font-size: 0.95rem;
    }

    .swap-btn {
      background: none;
      border: 2px solid #d1d5db;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      cursor: pointer;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      color: #6b7280;
    }

    .swap-btn:hover {
      border-color: #4f46e5;
      color: #4f46e5;
      background: #eef2ff;
    }

    @media (max-width: 768px) {
      .header h1 {
        font-size: 2rem;
      }

      .content {
        padding: 20px;
      }

      .main-area {
        flex-direction: column;
      }

      textarea {
        min-height: 150px;
      }

      .button-column {
        flex-direction: row;
        padding: 5px 0;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Base64 인코딩/디코딩</h1>
      <p>텍스트를 Base64로 인코딩하거나 Base64 문자열을 디코딩하는 도구</p>
    </div>

    <div class="content">
      <div class="error-msg" id="error"></div>

      <div class="main-area">
        <div class="panel">
          <label class="input-label">입력</label>
          <textarea id="input" placeholder="인코딩 또는 디코딩할 텍스트를 여기에 입력하세요..."></textarea>
        </div>

        <div class="button-column">
          <button class="convert-btn active" id="btnEncode" onclick="setMode('encode')">Encode</button>
          <button class="swap-btn" onclick="swap()" title="입력/출력 바꾸기">&#8644;</button>
          <button class="convert-btn decode" id="btnDecode" onclick="setMode('decode')">Decode</button>
        </div>

        <div class="panel output-panel">
          <div class="result-label">
            <label class="input-label">결과</label>
            <div class="pretty-toggle" id="prettyToggle">
              <span>JSON Pretty</span>
              <label class="toggle-switch">
                <input type="checkbox" id="prettyCheck" onchange="togglePretty()">
                <span class="toggle-slider"></span>
              </label>
            </div>
          </div>
          <textarea id="output" readonly></textarea>
          <button class="copy-btn" onclick="copyToClipboard('output', this)">복사</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let rawOutput = '';

    function isJson(str) {
      try {
        const parsed = JSON.parse(str);
        return typeof parsed === 'object' && parsed !== null;
      } catch (e) {
        return false;
      }
    }

    function showOutput() {
      const toggle = document.getElementById("prettyToggle");
      const prettyCheck = document.getElementById("prettyCheck");

      if (isJson(rawOutput)) {
        toggle.classList.add("visible");
        if (prettyCheck.checked) {
          document.getElementById("output").value = JSON.stringify(JSON.parse(rawOutput), null, 2);
        } else {
          document.getElementById("output").value = rawOutput;
        }
      } else {
        toggle.classList.remove("visible");
        prettyCheck.checked = false;
        document.getElementById("output").value = rawOutput;
      }
    }

    function togglePretty() {
      showOutput();
    }

    let mode = 'encode'; // 'encode' or 'decode'

    function looksLikeBase64(str) {
      const trimmed = str.trim();
      if (trimmed.length < 4) return false;
      return /^[A-Za-z0-9+/\-_~=\s]+$/.test(trimmed);
    }

    function tryDecode(input) {
      const strategies = [
        function(s) { return s; },
        function(s) { return s.replace(/-/g, '+').replace(/_/g, '/'); },
        function(s) { return s.replace(/-/g, '+').replace(/~/g, '/').replace(/_/g, '='); },
      ];

      for (const strategy of strategies) {
        try {
          let base64 = strategy(input.trim().replace(/\s/g, ''));
          while (base64.length % 4 !== 0) {
            base64 += '=';
          }
          return decodeURIComponent(escape(atob(base64)));
        } catch (e) {
          continue;
        }
      }
      return null;
    }

    function autoConvert() {
      const input = document.getElementById("input").value;
      const errorEl = document.getElementById("error");
      errorEl.style.display = "none";

      if (!input.trim()) {
        rawOutput = '';
        showOutput();
        updateModeButtons();
        return;
      }

      if (mode === 'decode') {
        const decoded = tryDecode(input);
        if (decoded !== null) {
          rawOutput = decoded;
          showOutput();
        } else {
          rawOutput = '';
          errorEl.textContent = "유효하지 않은 Base64 문자열입니다.";
          errorEl.style.display = "block";
          document.getElementById("output").value = '';
        }
      } else {
        try {
          rawOutput = btoa(unescape(encodeURIComponent(input)));
          showOutput();
        } catch (e) {
          rawOutput = '';
          errorEl.textContent = "인코딩 중 오류가 발생했습니다.";
          errorEl.style.display = "block";
          document.getElementById("output").value = '';
        }
      }
    }

    function setMode(newMode) {
      mode = newMode;
      updateModeButtons();
      autoConvert();
    }

    function updateModeButtons() {
      document.getElementById("btnEncode").classList.toggle("active", mode === 'encode');
      document.getElementById("btnDecode").classList.toggle("active", mode === 'decode');
    }

    function swap() {
      const inputEl = document.getElementById("input");
      const outputEl = document.getElementById("output");
      const outputValue = outputEl.value;
      if (outputValue) {
        mode = (mode === 'encode') ? 'decode' : 'encode';
        inputEl.value = outputValue;
        updateModeButtons();
        autoConvert();
      }
    }

    function copyToClipboard(textareaId, button) {
      const textarea = document.getElementById(textareaId);
      const text = textarea.value;

      if (!text.trim()) {
        alert("복사할 내용이 없습니다.");
        return;
      }

      navigator.clipboard.writeText(text).then(() => {
        const originalText = button.textContent;
        button.textContent = "복사됨!";
        button.classList.add("copied");
        setTimeout(() => {
          button.textContent = originalText;
          button.classList.remove("copied");
        }, 2000);
      }).catch(() => {
        textarea.select();
        textarea.setSelectionRange(0, 99999);
        document.execCommand('copy');
        const originalText = button.textContent;
        button.textContent = "복사됨!";
        button.classList.add("copied");
        setTimeout(() => {
          button.textContent = originalText;
          button.classList.remove("copied");
        }, 2000);
      });
    }

    document.getElementById("input").addEventListener("input", autoConvert);
    updateModeButtons();
  </script>
</body>
</html>
