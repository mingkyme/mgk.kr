<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LL-HLS 지연율 측정 타이머</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #2f81f7;
    --green: #3fb950;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 24px;
    min-height: 100vh;
  }
  h1 { font-size: 18px; font-weight: 600; color: var(--muted); letter-spacing: .5px; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px 36px;
    text-align: center;
    width: 100%;
    max-width: 720px;
  }
  .label {
    font-size: 13px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 12px;
  }
  .clock {
    font-family: "SF Mono", "Menlo", "Consolas", monospace;
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    line-height: 1;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: clip;
  }
  .clock.big { font-size: clamp(40px, 10vw, 104px); }
  .ms { color: var(--accent); font-size: 0.6em; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 720px; }
  .row .panel { flex: 1 1 200px; max-width: none; padding: 20px; }
  .row .clock { font-size: clamp(28px, 6vw, 44px); }
  .controls { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 22px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .15s;
  }
  button:hover { opacity: .85; }
  button.secondary { background: #21262d; border: 1px solid var(--border); color: var(--text); }
  .hint { font-size: 13px; color: var(--muted); max-width: 720px; text-align: center; line-height: 1.6; }
  .digit-frame {
    font-size: clamp(60px, 18vw, 200px);
  }
</style>
</head>
<body>
  <!-- 큰 벽시계: 카메라로 화면을 촬영해 스트림과 비교 -->
  <div class="panel">
    <div class="label">현재 시각 (Wall Clock)</div>
    <div class="clock big" id="wallClock">--:--:--<span class="ms">.---</span></div>
  </div>

  <div class="row">
    <div class="panel">
      <div class="label">경과 시간 (Elapsed)</div>
      <div class="clock" id="elapsed">0.000<span class="ms">s</span></div>
    </div>
    <div class="panel">
      <div class="label">순환 카운터 (ms)</div>
      <div class="clock" id="counter">000000</div>
    </div>
  </div>

  <div class="controls">
    <button id="resetBtn">경과 리셋</button>
    <button id="pauseBtn" class="secondary">일시정지</button>
    <button id="fsBtn" class="secondary">전체화면</button>
  </div>

<script>
  const wallClock = document.getElementById('wallClock');
  const elapsedEl = document.getElementById('elapsed');
  const counterEl = document.getElementById('counter');

  const startPerf = performance.now();
  let elapsedBase = startPerf;
  let paused = false;
  let pausedAt = 0;

  const pad = (n, w) => String(n).padStart(w, '0');

  function frame() {
    const now = new Date();
    const hh = pad(now.getHours(), 2);
    const mm = pad(now.getMinutes(), 2);
    const ss = pad(now.getSeconds(), 2);
    const ms = pad(now.getMilliseconds(), 3);
    wallClock.innerHTML = `${hh}:${mm}:${ss}<span class="ms">.${ms}</span>`;

    if (!paused) {
      const elapsed = (performance.now() - elapsedBase) / 1000;
      elapsedEl.innerHTML = `${elapsed.toFixed(3)}<span class="ms">s</span>`;
      // 60초마다 순환하는 밀리초 카운터
      const c = Math.floor(performance.now() - elapsedBase) % 60000;
      counterEl.textContent = pad(c, 5);
    }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  document.getElementById('resetBtn').onclick = () => {
    elapsedBase = performance.now();
    pausedAt = elapsedBase;
  };

  const pauseBtn = document.getElementById('pauseBtn');
  pauseBtn.onclick = () => {
    if (!paused) {
      paused = true;
      pausedAt = performance.now();
      pauseBtn.textContent = '재개';
    } else {
      // 멈춘 만큼 base 를 밀어줘서 경과값 연속성 유지
      elapsedBase += performance.now() - pausedAt;
      paused = false;
      pauseBtn.textContent = '일시정지';
    }
  };

  document.getElementById('fsBtn').onclick = () => {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen();
    else document.exitFullscreen();
  };
</script>
</body>
</html>
