<svg xmlns="http://www.w3.org/2000/svg" width="300" height="380" viewBox="0 0 300 380" role="img"><title>Four separate A4 pages in reading order</title><rect width="100%" height="100%" fill="white"/><rect x="10" y="10" width="119.056" height="168.378" fill="#bfdbfe" stroke="#334155"/><text x="20" y="30" font-size="10" font-family="sans-serif">TILE 1</text><rect x="150" y="10" width="119.056" height="168.378" fill="#bbf7d0" stroke="#334155"/><text x="160" y="30" font-size="10" font-family="sans-serif">TILE 2</text><rect x="10" y="200" width="119.056" height="168.378" fill="#fde68a" stroke="#334155"/><text x="20" y="220" font-size="10" font-family="sans-serif">TILE 3</text><rect x="150" y="200" width="119.056" height="168.378" fill="#fecaca" stroke="#334155"/><text x="160" y="220" font-size="10" font-family="sans-serif">TILE 4</text></svg>